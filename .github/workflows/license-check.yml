name: License Header Check

on:
  pull_request:

# Drop all permissions except the ability to checkout code
permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.21'
      - name: Check license headers
        # The -check flag ensures it fails if headers are missing, and -s=only skips checking third-party vendor folders if any.
        run: go run github.com/google/addlicense@v1.1.1 -check .
