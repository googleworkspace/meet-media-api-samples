name: Do Not Merge

on:
  pull_request:
    # It is important to include labeled/unlabeled so the check updates instantly
    # when a repository admin adds or removes the label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Drop all permissions except the ability to read PR data
permissions:
  pull-requests: read

jobs:
  check-labels:
    name: Check Labels
    runs-on: ubuntu-latest
    steps:
      - name: Verify "do not merge" is not present
        run: |
          # Check for common variants of the label
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'do not merge') || contains(github.event.pull_request.labels.*.name, 'do-not-merge') || contains(github.event.pull_request.labels.*.name, 'DO NOT MERGE') }}" == "true" ]]; then
            echo "::error::This Pull Request is labeled with 'do not merge' and cannot be merged."
            exit 1
          fi
          echo "No blocking labels found."
